name: Final polish
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove footer disclaimer and enforce RTL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="foot">האבחון נותן כיוון ראשוני — לא תחליף להיכרות עם העסק.</div>','')
          s=s.replace('<html lang="he" dir="rtl">','<html lang="he" dir="rtl">')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove disclaimer and keep Hebrew RTL layout'
          git push
