name: Remove quiz footer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, 'Remove unnecessary footer')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove footer text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<div class="foot">האבחון נותן כיוון ראשוני — לא תחליף להיכרות עם העסק.</div>', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove unnecessary footer"
          git push
