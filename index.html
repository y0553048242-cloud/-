<title>מה העסק שלך באמת צריך? | יוסי רוט</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#64748b;--accent:#111827;--accent2:#0f766e;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#e8eefb,transparent 35%),linear-gradient(145deg,#f8fafc,#eef2f7);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--text)}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.app{width:min(700px,100%);background:rgba(255,255,255,.97);border:1px solid #e5e7eb;border-radius:28px;box-shadow:0 24px 70px rgba(15,23,42,.13);overflow:hidden}.hero{padding:30px 32px 25px;background:linear-gradient(135deg,#111827,#1f2937);color:white}.brand{font-weight:700;letter-spacing:.2px;margin-bottom:18px;font-size:15px}.pill{display:inline-block;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 11px;color:#e5e7eb;font-size:12px;margin-bottom:12px}.hero h1{font-size:32px;line-height:1.12;margin:0 0 10px}.hero p{margin:0;color:#cbd5e1;line-height:1.65;font-size:16px}.progress{height:5px;background:#e5e7eb}.fill{height:100%;background:#0f766e;width:0;transition:.25s}.body{padding:30px 32px 32px}.count{font-size:13px;color:var(--muted);margin-bottom:12px}.q{font-size:24px;line-height:1.4;margin:0 0 20px}.answers{display:grid;gap:11px}button.answer{border:1px solid var(--line);background:#fff;border-radius:15px;padding:16px 17px;text-align:right;font-size:16px;color:var(--text);cursor:pointer;transition:.15s}button.answer:hover{border-color:#94a3b8;box-shadow:0 7px 22px rgba(15,23,42,.07);transform:translateY(-1px)}.result{display:none}.eyebrow{font-size:13px;color:var(--accent2);font-weight:700;margin-bottom:8px}.result h2{font-size:30px;margin:0 0 10px}.result p{font-size:17px;line-height:1.75;color:#334155}.box{margin:20px 0;padding:17px;border:1px solid var(--line);background:#f8fafc;border-radius:16px;line-height:1.7}.cta{display:inline-block;background:#111827;color:#fff;text-decoration:none;border-radius:13px;padding:14px 19px;font-weight:700}.restart{display:block;border:0;background:transparent;color:var(--muted);margin-top:14px;cursor:pointer;padding:4px}.foot{padding:0 32px 23px;color:#94a3b8;font-size:12px}@media(max-width:520px){.hero{padding:25px 21px 22px}.body{padding:24px 20px}.hero h1{font-size:27px}.q{font-size:21px}.foot{padding:0 20px 20px}}
</style></head><body><div class="wrap"><main class="app"><section class="hero"><div class="brand">יוסי רוט | אסטרטגיה · שיווק · תקשורת</div><div class="pill">אבחון שיווקי קצר · כ־60 שניות</div><h1>מה העסק שלך באמת צריך?</h1><p>יחסי ציבור, פרסום, שיווק או מכירות? ענה על 6 שאלות וקבל כיוון ראשוני.</p></section><div class="progress"><div class="fill" id="fill"></div></div><section class="body" id="quiz"><div class="count" id="count"></div><h2 class="q" id="question"></h2><div class="answers" id="answers"></div></section><section class="body result" id="result"><div class="eyebrow">האבחון שלך</div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="box"><strong>מה זה אומר?</strong><br><span id="reason"></span></div><a class="cta" href="https://wa.me/972553048242?text=%D7%94%D7%99%D7%99%20%D7%99%D7%95%D7%A1%D7%99%2C%20%D7%A2%D7%A9%D7%99%D7%AA%D7%99%20%D7%90%D7%AA%20%D7%94%D7%9E%D7%91%D7%97%D7%9F%20%D7%95%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%A7%D7%91%D7%9C%20%D7%90%D7%91%D7%97%D7%95%D7%9F%20%D7%A7%D7%A6%D7%A8%20%D7%A2%D7%9C%20%D7%94%D7%A2%D7%A1%D7%A7%20%D7%A9%D7%9C%D7%99.">רוצה שאבחן את העסק שלך? →</a><button class="restart" onclick="restart()">↻ להתחיל מחדש</button></section><div class="foot">הכלי הוא אבחון ראשוני ולא תחליף לניתוח עסקי מלא.</div></main></div><script>
const qs=[{q:'מה הכי מתסכל אותך כרגע?',a:[['אין מספיק אנשים שמכירים אותנו','pr'],['אנשים מכירים אותנו, אבל לא מגיעות מספיק פניות','sales'],['יש פניות, אבל המסר שלנו לא ברור','marketing'],['אנחנו צריכים לייצר יותר חשיפה עכשיו','ads']]},{q:'כשאתה אומר "אנחנו חייבים שיווק" — למה אתה מתכוון בפועל?',a:[['שיהיו עלינו כתבות וידברו עלינו','pr'],['שיראו את העסק הרבה יותר','ads'],['שהלקוחות יבינו למה לבחור דווקא בנו','marketing'],['שיותר מהמתעניינים יהפכו ללקוחות','sales']]},{q:'איפה אתה מרגיש שהכסף נתקע?',a:[['כמעט אף אחד לא מכיר אותנו','pr'],['אנחנו לא מגיעים מספיק לקהל','ads'],['מגיע קהל, אבל ההצעה לא מספיק חדה','marketing'],['מגיעים לידים, אבל קשה לסגור','sales']]},{q:'מה היית רוצה לראות בעוד 90 יום?',a:[['יותר אמון, מיצוב וסמכות','pr'],['יותר חשיפות ותנועה','ads'],['מסר, הצעה ומשפך הרבה יותר מדויקים','marketing'],['יותר פגישות, הצעות וסגירות','sales']]},{q:'מה המשפט שהכי דומה למצב שלך?',a:[['יש לנו סיפור טוב — לא מספיק מכירים אותו','pr'],['יש לנו מוצר — צריך להביא אליו קהל','ads'],['יש לנו מוצר וקהל — צריך לדייק את הדרך שבה מציגים אותו','marketing'],['יש לנו ביקוש — צריך להפוך אותו להכנסה','sales']]},{q:'ובכנות: מה הכי חשוב לך עכשיו?',a:[['להיות מותג שאי אפשר להתעלם ממנו','pr'],['להיות בכל מקום שהלקוחות נמצאים בו','ads'],['לבנות מנוע שיווקי שעובד בצורה מסודרת','marketing'],['להכניס יותר כסף מהפעילות שכבר קיימת','sales']]}];
const results={pr:{title:'יחסי ציבור',text:'כנראה שהבעיה המרכזית שלך היא לא עוד מודעה — אלא אמון, מיצוב וסמכות.',reason:'יש לך צורך להפוך פעילות, הישגים וסיפור עסקי לנכס תדמיתי שמקצר דרך אל קהל ומקבלי החלטות.'},ads:{title:'פרסום',text:'נשמע שהמנוע שחסר לך כרגע הוא חשיפה ממוקדת שמביאה קהל.',reason:'כשהמוצר והמסר כבר קיימים, פרסום טוב יכול להגדיל את כמות האנשים הרלוונטיים שנכנסים למערכת.'},marketing:{title:'שיווק',text:'נראה שהצוואר בקבוק נמצא במסר, בהצעה או במסע הלקוח.',reason:'לפני שמזרימים עוד כסף לתקשורת, צריך לוודא שהעסק יודע למי הוא מוכר, מה הוא מבטיח ולמה לבחור בו.'},sales:{title:'מכירות',text:'כנראה שלא חסרה לך עוד חשיפה — חסר תהליך שממיר עניין להכנסה.',reason:'אם כבר מגיעים לידים או מתעניינים, כדאי לשפר את ההצעה, הטיפול בלידים, הפגישות והסגירה לפני שמגדילים תקציב.'}};
let i=0,scores={pr:0,ads:0,marketing:0,sales:0};const q=document.getElementById('question'),a=document.getElementById('answers'),c=document.getElementById('count'),f=document.getElementById('fill');function render(){const x=qs[i];c.textContent=`שאלה ${i+1} מתוך ${qs.length}`;q.textContent=x.q;a.innerHTML='';x.a.forEach(([t,k])=>{const b=document.createElement('button');b.className='answer';b.textContent=t;b.onclick=()=>{scores[k]++;i<qs.length-1?(i++,render()):show()};a.appendChild(b)});f.style.width=`${i/qs.length*100}%`}function show(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';f.style.width='100%';const w=Object.keys(scores).sort((x,y)=>scores[y]-scores[x])[0],r=results[w];document.getElementById('resultTitle').textContent=r.title;document.getElementById('resultText').textContent=r.text;document.getElementById('reason').textContent=r.reason}function restart(){i=0;scores={pr:0,ads:0,marketing:0,sales:0};document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render()}render();
</script></body></html>
