<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>מה חסר לעסק שלך עכשיו?</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f2f0;color:#151515;font-family:Arial,"Noto Sans Hebrew",sans-serif}.app{width:min(680px,100%);min-height:100vh;margin:auto;background:#fff}.head{height:70px;padding:0 22px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:flex-start}.dot{width:9px;height:9px;background:#e12636;border-radius:50%;box-shadow:0 0 0 5px #e1263620}.hero{padding:54px 24px 48px}.eyebrow{font-size:14px;color:#888;margin-bottom:10px}.hero h1{font-size:42px;line-height:1.08;margin:0 0 16px;letter-spacing:-1px}.hero h1 span{color:#d92334}.hero p{font-size:18px;line-height:1.7;color:#60605c;margin:0}.start{margin-top:28px;background:#111;color:#fff;border:0;border-radius:16px;padding:17px 30px;font-size:18px;font-weight:800;cursor:pointer}.start i{color:#e12636;font-style:normal}.quiz,.result{display:none;padding:28px 22px 42px}.topline{display:flex;justify-content:space-between;color:#888;font-size:12px;margin-bottom:14px}.topline b{color:#111}.bar{height:5px;background:#e6e6e3;border-radius:10px;overflow:hidden;margin-bottom:30px}.fill{height:100%;background:#d92334;width:0}.domain{font-size:13px;color:#d92334;font-weight:800;margin-bottom:8px}.q{font-size:27px;line-height:1.35;margin:0 0 12px}.hint{font-size:14px;line-height:1.6;color:#777;margin:0 0 20px}.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.num{border:1px solid #ddd;background:#fff;border-radius:10px;padding:12px 0;font-weight:800;font-size:15px;cursor:pointer}.num:hover,.num.sel{background:#111;color:#fff;border-color:#111}.labels{display:flex;justify-content:space-between;color:#999;font-size:11px;margin-top:8px}.result h2{font-size:32px;line-height:1.2;margin:14px 0 10px}.lead{font-size:17px;line-height:1.7;color:#5c5c58}.map{border:1px solid #e0e0dc;border-radius:18px;padding:18px;background:#fafaf8;margin-top:22px}.map h3{margin:0 0 16px;font-size:16px}.metric{display:grid;grid-template-columns:90px 1fr 35px;gap:8px;align-items:center;margin:14px 0;font-size:12px}.track{height:8px;background:#e5e5e2;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:#d92334;border-radius:99px}.next{margin-top:16px;border-right:3px solid #d92334;background:#f5f5f3;border-radius:12px;padding:14px;font-size:13px;line-height:1.6}.again{margin:16px auto 0;display:block;border:0;background:none;color:#888;cursor:pointer}@media(max-width:560px){.hero{padding:42px 20px 38px}.hero h1{font-size:35px}.hero p{font-size:16px}.quiz,.result{padding:24px 18px 34px}.q{font-size:24px}.result h2{font-size:28px}.metric{grid-template-columns:84px 1fr 30px}}</style></head><body><main class="app"><header class="head"><span class="dot"></span></header><section class="hero" id="hero"><div class="eyebrow">אבחון עסקי קצר</div><h1>מה חסר לעסק<br><span>שלך?</span></h1><p>10 שאלות קצרות. בסוף תקבל תמונה ברורה של מה העסק שלך צריך לחזק עכשיו.</p><button class="start" onclick="startQuiz()"><i>↗</i> מתחילים</button></section><section class="quiz" id="quiz"><div class="topline"><b id="counter">שאלה 1 מתוך 10</b><span id="domainTop">שיווק</span></div><div class="bar"><div class="fill" id="progress"></div></div><div class="domain" id="domain"></div><h2 class="q" id="question"></h2><p class="hint">דרג מ־1 עד 10 לפי המצב האמיתי בעסק שלך.</p><div class="scale" id="scale"></div><div class="labels"><span>חלש מאוד</span><span>חזק מאוד</span></div></section><section class="result" id="result"><div class="eyebrow">התוצאה שלך</div><h2 id="resultTitle"></h2><p class="lead" id="resultLead"></p><div class="map"><h3>מפת 4 התחומים</h3><div id="metrics"></div></div><div class="next" id="next"></div><button class="again" onclick="location.reload()">↻ להתחיל מחדש</button></section></main><script>const qs=[['שיווק','יש לעסק שלך מסר שיווקי חד וברור?','שיווק'],['שיווק','הלקוחות הנכונים נחשפים לעסק שלך באופן עקבי?','שיווק'],['מכירות','יש לך תהליך מסודר שהופך מתעניינים ללקוחות?','מכירות'],['מכירות','אתה יודע להסביר בקלות למה כדאי לקנות דווקא ממך?','מכירות'],['יחסי ציבור','העסק שלך מקבל חשיפה ואמינות דרך תקשורת וקהילות?','יחסי ציבור'],['יחסי ציבור','יש לך סיפורים, הישגים או תוכן שאפשר להפוך לחשיפה?','יחסי ציבור'],['מיתוג ובידול','ברור בתוך כמה שניות במה העסק שלך שונה מהמתחרים?','מיתוג ובידול'],['מיתוג ובידול','העסק שלך נראה וזכיר באופן עקבי בכל נקודת מגע?','מיתוג ובידול'],['שיווק','יש לך אסטרטגיית שיווק ברורה ולא רק פעולות נקודתיות?','שיווק'],['מכירות','יש לך דרך קבועה למדוד ולשפר את תוצאות המכירה?','מכירות']];let i=0,ans=[];const domains=['שיווק','מכירות','יחסי ציבור','מיתוג ובידול'];function startQuiz(){document.getElementById('hero').style.display='none';document.getElementById('quiz').style.display='block';render()}function render(){const q=qs[i];document.getElementById('counter').textContent=`שאלה ${i+1} מתוך 10`;document.getElementById('domainTop').textContent=q[2];document.getElementById('domain').textContent=q[0];document.getElementById('question').textContent=q[1];document.getElementById('progress').style.width=((i)/10*100)+'%';const s=document.getElementById('scale');s.innerHTML='';for(let n=1;n<=10;n++){const b=document.createElement('button');b.className='num';b.textContent=n;b.onclick=()=>choose(n);s.appendChild(b)}}function choose(n){ans[i]=n;i++;if(i<qs.length)render();else showResult()}function showResult(){const scores={שיווק:0,מכירות:0,'יחסי ציבור':0,'מיתוג ובידול':0},counts={שיווק:0,מכירות:0,'יחסי ציבור':0,'מיתוג ובידול':0};qs.forEach((q,j)=>{scores[q[2]]+=ans[j];counts[q[2]]++});const pct={};domains.forEach(d=>pct[d]=Math.round(scores[d]/counts[d]*10));const weakest=domains.slice().sort((a,b)=>pct[a]-pct[b])[0];const titles={'שיווק':'שיווק חד וברור','מכירות':'מכירות ותהליך סגירה','יחסי ציבור':'יחסי ציבור וחשיפה','מיתוג ובידול':'מיתוג ובידול'};document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';document.getElementById('resultTitle').innerHTML='הדבר שהכי חשוב<br>לעסק שלך הוא <span style="color:#d92334">'+titles[weakest]+'</span>';document.getElementById('resultLead').textContent='זה התחום שכדאי לחזק עכשיו כדי ליצור עסק ברור, חזק וצומח יותר.';document.getElementById('metrics').innerHTML=domains.map(d=>`<div class="metric"><span>${d}</span><div class="track"><i style="width:${pct[d]}%"></i></div><b>${pct[d]}%</b></div>`).join('');document.getElementById('next').innerHTML='<b>הצעד הבא</b><br>מקד את הפעולה הקרובה בתחום '+weakest+' ובנה סביבו מהלך ברור ומדיד.'}</script></body></html>
