<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>מה חסר לעסק שלך עכשיו?</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f2f0;color:#151515;font-family:Arial,"Noto Sans Hebrew",sans-serif}.app{width:min(680px,100%);min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 50px #00000012}.head{height:70px;padding:0 22px;background:#111;display:flex;align-items:center;justify-content:flex-end;border-bottom:1px solid #222}.dot{width:9px;height:9px;border-radius:50%;background:#e12636;box-shadow:0 0 0 5px #e1263620}.hero,.quiz,.result{padding:44px 22px 42px}.quiz,.result{display:none}.eyebrow{font-size:13px;color:#888;margin-bottom:10px}.hero h1{font-size:42px;line-height:1.08;margin:0 0 16px}.hero h1 span,.result h2 span{color:#d92334}.hero p,.lead{font-size:18px;line-height:1.7;color:#60605c;margin:0}.start{margin-top:26px;border:0;border-radius:16px;background:#111;color:#fff;padding:17px 30px;font-size:18px;font-weight:800;cursor:pointer}.start i{color:#e12636;font-style:normal}.topline{display:flex;justify-content:space-between;color:#888;font-size:12px;margin-bottom:14px}.topline b{color:#111}.bar{height:5px;background:#e6e6e3;border-radius:10px;overflow:hidden;margin-bottom:30px}.fill{height:100%;background:#d92334;width:0;border-radius:10px}.domain{font-size:13px;color:#d92334;font-weight:800;margin-bottom:8px}.q{font-size:27px;line-height:1.35;margin:0 0 12px}.hint{font-size:14px;line-height:1.6;color:#777;margin:0 0 20px}.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.num{border:1px solid #ddd;background:#fff;border-radius:10px;padding:12px 0;font-weight:800;font-size:15px;cursor:pointer}.num:hover,.num.sel{background:#111;color:#fff;border-color:#111}.labels{display:flex;justify-content:space-between;color:#999;font-size:11px;margin-top:8px}.back{margin-top:16px;border:0;background:none;color:#888;cursor:pointer}.result h2{font-size:32px;line-height:1.2;margin:12px 0 10px}.map{border:1px solid #e0e0dc;border-radius:18px;padding:18px;background:#fafaf8;margin-top:20px}.map h3{margin:0 0 16px;font-size:16px}.metric{display:grid;grid-template-columns:110px 1fr 38px;gap:8px;align-items:center;margin:14px 0;font-size:12px}.track{height:8px;background:#e5e5e2;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:#d92334;border-radius:99px}.next{margin-top:16px;border-right:3px solid #d92334;background:#f5f5f3;border-radius:12px;padding:14px;font-size:13px;line-height:1.6}.wa{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:#16c766;color:#fff;border-radius:16px;padding:17px;margin-top:18px;font-size:17px;font-weight:850;box-shadow:0 10px 24px #16c76630}.wa small{display:block;font-size:10px;font-weight:500;margin-top:2px}.again{margin:14px auto 0;display:block;border:0;background:none;color:#888;cursor:pointer}@media(max-width:560px){.hero,.quiz,.result{padding:40px 18px 34px}.hero h1{font-size:35px}.hero p,.lead{font-size:16px}.q{font-size:24px}.result h2{font-size:28px}.metric{grid-template-columns:86px 1fr 32px}}</style></head><body><main class="app"><header class="head"><span class="dot"></span></header><section id="hero" class="hero"><div class="eyebrow">אבחון עסקי קצר</div><h1>מה חסר לעסק <span>שלך?</span></h1><p>10 שאלות קצרות. בסוף תקבל תמונה ברורה של מה העסק שלך צריך לחזק עכשיו.</p><button class="start" onclick="startQuiz()">מתחילים <i>↗</i></button></section><section id="quiz" class="quiz"><div class="topline"><b id="counter"></b><span id="domainTop"></span></div><div class="bar"><div class="fill" id="progress"></div></div><div class="domain" id="domain"></div><h2 class="q" id="question"></h2><p class="hint">דרג מ־1 עד 10 לפי המצב האמיתי בעסק שלך.</p><div class="scale" id="scale"></div><div class="labels"><span>חלש מאוד</span><span>חזק מאוד</span></div><button id="back" class="back" onclick="goBack()">← חזרה</button></section><section id="result" class="result"><div class="eyebrow">התוצאה שלך</div><h2 id="resultTitle"></h2><p class="lead" id="resultLead"></p><div class="map"><h3>מפת 4 התחומים</h3><div id="metrics"></div></div><div class="next" id="next"></div><a id="wa" class="wa" href="https://wa.me/972553048242" target="_blank" rel="noopener">💬 <span>רוצה לדבר על התוצאה?<small>שלח לי את התוצאה בוואטסאפ</small></span></a><button class="again" onclick="restart()">↻ להתחיל מחדש</button></section></main><script>const qs=[['שיווק','יש לעסק שלך מסר שיווקי חד וברור?'],['שיווק','הלקוחות הנכונים נחשפים לעסק שלך באופן עקבי?'],['מכירות','יש לך תהליך מסודר שהופך מתעניינים ללקוחות?'],['מכירות','אתה יודע להסביר בקלות למה כדאי לקנות דווקא ממך?'],['יחסי ציבור','העסק שלך מקבל חשיפה ואמינות דרך תקשורת וקהילות?'],['יחסי ציבור','יש לך סיפורים, הישגים או תוכן שאפשר להפוך לחשיפה?'],['מיתוג ובידול','ברור בתוך כמה שניות במה העסק שלך שונה מהמתחרים?'],['מיתוג ובידול','העסק שלך נראה וזכיר באופן עקבי בכל נקודת מגע?'],['שיווק','יש לך אסטרטגיית שיווק ברורה ולא רק פעולות נקודתיות?'],['מכירות','יש לך דרך קבועה למדוד ולשפר את תוצאות המכירה?']];const domains=['שיווק','מכירות','יחסי ציבור','מיתוג ובידול'];const titles={'שיווק':'שיווק חד וברור','מכירות':'מכירות ותהליך סגירה','יחסי ציבור':'יחסי ציבור וחשיפה','מיתוג ובידול':'מיתוג ובידול'};const icons={'שיווק':'📈','מכירות':'💰','יחסי ציבור':'📣','מיתוג ובידול':'✨'};let i=0,ans=[];function $(id){return document.getElementById(id)}function startQuiz(){i=0;ans=[];$('hero').style.display='none';$('result').style.display='none';$('quiz').style.display='block';render()}function render(){const q=qs[i];$('counter').textContent=`שאלה ${i+1} מתוך 10`;$('domainTop').textContent=q[0];$('domain').textContent=q[0];$('question').textContent=q[1];$('progress').style.width=((i+1)/10*100)+'%';const s=$('scale');s.innerHTML='';for(let n=1;n<=10;n++){const b=document.createElement('button');b.className='num'+(ans[i]===n?' sel':'');b.textContent=n;b.onclick=()=>choose(n);s.appendChild(b)}$('back').style.visibility=i?'visible':'hidden';window.scrollTo(0,0)}function choose(n){ans[i]=n;i++;if(i<qs.length)render();else showResult()}function goBack(){if(i>0){i--;render()}}function showResult(){const scores={'שיווק':0,'מכירות':0,'יחסי ציבור':0,'מיתוג ובידול':0},counts={'שיווק':0,'מכירות':0,'יחסי ציבור':0,'מיתוג ובידול':0};qs.forEach((q,j)=>{scores[q[0]]+=ans[j]||1;counts[q[0]]++});const pct={};domains.forEach(d=>pct[d]=Math.round(scores[d]/counts[d]*10));const weakest=domains.slice().sort((a,b)=>pct[a]-pct[b])[0];$('quiz').style.display='none';$('result').style.display='block';$('resultTitle').innerHTML='הדבר שהכי חשוב<br>לעסק שלך הוא <span>'+titles[weakest]+'</span>';$('resultLead').textContent='זה התחום שכדאי לחזק עכשיו כדי ליצור עסק ברור, חזק וצומח יותר.';$('metrics').innerHTML=domains.map(d=>`<div class="metric"><span>${icons[d]} ${d}</span><div class="track"><i style="width:${pct[d]}%"></i></div><b>${pct[d]}%</b></div>`).join('');$('next').innerHTML='<b>הצעד הבא</b><br>מקד את הפעולה הקרובה בתחום '+titles[weakest]+' ובנה סביבו מהלך ברור ומדיד.';$('wa').href='https://wa.me/972553048242?text='+encodeURIComponent('היי יוסי, השלמתי את האבחון. התחום המרכזי שעלה לי הוא '+titles[weakest]+'.');window.scrollTo(0,0)}function restart(){i=0;ans=[];$('result').style.display='none';$('quiz').style.display='none';$('hero').style.display='block';window.scrollTo(0,0)}</script></body></html>
