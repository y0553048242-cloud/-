nd:#e4e4e2;border-radius:9px}.fill{height:100%;background:#d82032;border-radius:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid #ddd;border-radius:14px;padding:14px}.box b{font-size:12px}.box span{display:block;color:#777;font-size:12px;line-height:1.6;margin-top:6px}.next{margin:14px 0;border-right:3px solid #d82032;background:#f1f1ef;border-radius:12px;padding:14px}.next b{font-size:12px}.next p{font-size:12px;color:#666;line-height:1.6}.wa{display:flex;align-items:center;justify-content:center;gap:10px;background:#16c766;color:#fff;text-decoration:none;border-radius:15px;padding:17px;font-weight:850;font-size:15px;box-shadow:0 10px 25px #16c76633}.wa small{display:block;font-size:10px;font-weight:400;margin-top:2px}.foot{text-align:center;color:#aaa;font-size:10px;padding:20px}@media(max-width:520px){h1{font-size:34px}.hero{padding:44px 20px 38px}.q{font-size:23px}.grid{grid-template-columns:1fr}}</style><main class="app"><header class="head"><img class="logo" src="data:image/jpeg;base64,%%LOGO%%"><span class="dot"></span></header><section class="hero" id="hero"><div class="k">אבחון קצר לעסק</div><h1>מה <em>חסר</em> לעסק שלך עכשיו?</h1><p class="lead">8 שאלות קצרות שיעזרו לזהות איפה נמצא צוואר הבקבוק המרכזי כרגע.</p><button class="start" onclick="start()">מתחילים ←</button></section><div class="progress" id="progress"></div><section class="quiz" id="quiz"><div class="meta"><b id="count"></b><span id="pct"></span></div><h2 class="q" id="question"></h2><div class="answers" id="answers"></div><button class="back" id="back" onclick="back()">→ חזרה</button></section><section class="result" id="result"><div class="card"><div class="ri" id="ri">✦</div><div class="meta">מפת המצב שלך</div><h2 id="rt"></h2><p class="lead2" id="rx"></p><div class="map"><b>מה עלה מהתשובות</b><div class="metric"><span>נוכחות</span><div class="track"><div class="fill" id="a"></div></div><b id="av"></b></div><div class="metric"><span>חשיפה</span><div class="track"><div class="fill" id="b"></div></div><b id="bv"></b></div><div class="metric"><span>כיוון</span><div class="track"><div class="fill" id="c"></div></div><b id="cv"></b></div><div class="metric"><span>מכירות</span><div class="track"><div class="fill" id="d"></div></div><b id="dv"></b></div></div><div class="grid"><div class="box"><b>מה כנראה קורה</b><span id="rr"></span></div><div class="box"><b>מה כדאי לבדוק</b><span id="rn"></span></div></div><div class="next"><b>נקודה למחשבה</b><p id="nx"></p></div><a class="wa" id="wa" href="#">◔ <span>רוצה לבדוק את זה על העסק שלך?<small>שיחה קצרה בוואטסאפ</small></span></a><button class="again" onclick="restart()">↻ להתחיל מחדש</button></div></section><div class="foot">האבחון נותן כיוון ראשוני בלבד.</div></main><script>const qs=[['מה הכי מרגיש תקוע כרגע?',[['ההיכרות עם העסק','pr','◈'],['כמות האנשים שמגיעים','ads','↗'],['הדרך שבה אנחנו מציגים את עצמנו','m','✦'],['המעבר מפנייה ללקוח','s','✓']]],['אם דבר אחד היה משתפר בחודש הקרוב, מה היה הכי משמעותי?',[['יותר אמון ונוכחות','pr','◉'],['יותר אנשים רלוונטיים','ads','⌁'],['מסר והצעה ברורים יותר','m','◇'],['יותר סגירות','s','↗']]],['איפה אתה מרגיש שהדברים נתקעים?',[['אנשים לא מכירים אותנו מספיק','pr','◈'],['לא מגיע מספיק קהל','ads','◌'],['קשה להסביר את הערך','m','✦'],['יש עניין אבל הוא לא נסגר','s','✓']]],['מה היית רוצה לראות בעוד שלושה חודשים?',[['יותר נוכחות וסמכות','pr','◉'],['יותר תנועה ופניות','ads','↗'],['כיוון מסודר וברור','m','◇'],['יותר עסקאות','s','✓']]],['איזה משפט הכי קרוב אליך?',[['יש סיפור טוב, אבל הוא לא מספיק מוכר','pr','◈'],['יש מוצר טוב, צריך להביא אליו אנשים','ads','⌁'],['יש מוצר וקהל, אבל החיבור לא חד','m','✦'],['יש ביקוש, אבל אפשר להפיק ממנו יותר','s','✓']]],['כשלקוח חדש פוגש את העסק בפעם הראשונה, מה היית רוצה שיקרה?',[['שיזכור אותנו וייתן בנו אמון','pr','◉'],['שישאיר פרטים או יפנה','ads','↗'],['שיבין מיד למה אנחנו שונים','m','◇'],['שיתקדם להצעה או פגישה','s','✓']]],['מה הכי חסר לך היום כדי להרגיש שהעסק מתקדם?',[['נוכחות חזקה וברורה יותר','pr','◈'],['זרם יציב יותר של אנשים חדשים','ads','⌁'],['תכנית וכיוון שאפשר להתמיד בהם','m','✦'],['תהליך שמייצר יותר עסקאות','s','✓']]],['איפה היית רוצה לראות שינוי ראשון?',[['איך שהשוק רואה אותנו','pr','◉'],['כמה אנשים מגיעים אלינו','ads','↗'],['כמה ברור לנו מה עושים ולמי','m','◇'],['כמה מהעניין הופך להכנסה','s','✓']]]];const R={pr:['נוכחות ומיצוב','◈','נראה שהמקום הראשון שכדאי לחזק הוא האופן שבו העסק מוכר, נתפס ונזכר.','עסק יכול להיות מצוין ועדיין לא לקבל מספיק מקום בתודעה.','לבדוק איך העסק נתפס היום, איזה סיפור נכון להוביל ואיפה כדאי להיות נוכחים.'],ads:['חשיפה וביקוש','↗','נראה שהבסיס קיים, אבל חסרה כניסה מספקת של אנשים רלוונטיים.','לפני שמגדילים תקציבים חשוב לדעת מי הקהל ומה רוצים שיקרה אחרי החשיפה.','להגדיר קהל, מסר ויעד מדיד — ואז לבחור ערוצי חשיפה.'],m:['כיוון ומסר','✦','נראה שהצוואר בקבוק נמצא בחיבור בין העסק, המסר והלקוח.','כשהערך והבידול לא חדים, גם פרסום טוב עלול להביא תשומת לב בלי מספיק תוצאה.','לחדד למי העסק פונה, מה הוא פותר ולמה לבחור דווקא בו.'],s:['תהליך המכירה','✓','נראה שכבר יש עניין — וההזדמנות היא להפוך יותר ממנו לתוצאה.','כאשר קיימות פניות, שיפור הדרך מפנייה ועד החלטה יכול להיות משמעותי.','לבדוק מה קורה לליד מהרגע שהוא נכנס: תגובה, שיחה, הצעה ופולואפ.']};let i=0,h=[],s={pr:0,ads:0,m:0,s:0};const $=x=>document.getElementById(x);function start(){$('hero').style.display='none';$('progress').style.display='flex';$('quiz').style.display='block';$('progress').innerHTML=qs.map((_,n)=>`<div class="bar" id="p${n}"></div>`).join('');render()}function render(){let x=qs[i];$('count').textContent=`שאלה ${i+1} מתוך 8`;$('pct').textContent=Math.round(i/8*100)+'%';$('question').textContent=x[0];$('answers').innerHTML='';x[1].forEach(z=>{let b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="ico">${z[2]}</span><span>${z[0]}</span>`;b.onclick=()=>choose(z[1]);$('answers').appendChild(b)});for(let n=0;n<8;n++)$('p'+n).classList.toggle('on',n<=i);$('back').disabled=i===0}function choose(k){h.push(k);s[k]++;if(i<7){i++;render();scrollTo(0,0)}else show()}function back(){if(!i)return;let k=h.pop();s[k]--;i--;render()}function show(){$('quiz').style.display='none';$('progress').style.display='none';$('result').style.display='block';let k=Object.keys(s).sort((a,b)=>s[b]-s[a])[0],r=R[k],mx=Math.max(...Object.values(s),1);$('ri').textContent=r[1];$('rt').textContent=r[0];$('rx').textContent=r[2];$('rr').textContent=r[3];$('rn').textContent=r[4];$('nx').textContent='לא כל בעיה דורשת עוד פרסום. כדאי לוודא שהמהלך הבא מטפל בסיבה — ולא רק במה שרואים מבחוץ.';[['pr','a','av'],['ads','b','bv'],['m','c','cv'],['s','d','dv']].forEach(z=>{$(z[1]).style.width=Math.round(s[z[0]]/mx*100)+'%';$(z[2]).textContent=s[z[0]]});let msg=encodeURIComponent(`היי יוסי, עשיתי את האבחון וקיבלתי: ${r[0]}. אשמח לבדוק איתך מה נכון לעסק שלי.`);$('wa').href='https://wa.me/972553048242?text='+msg;scrollTo(0,0)}function restart(){i=0;h=[];s={pr:0,ads:0,m:0,s:0};$('result').style.display='none';$('hero').style.display='block';scrollTo(0,0)}</script></html>
