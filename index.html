<script>
const qs=[

['איפה אתה מרגיש שהדברים נתקעים?',[['אנשים לא מכירים אותנו מספיק','pr','◈'],['לא מגיע מספיק קהל','ads','◌'],['קשה להסביר את הערך','m','✦'],['יש עניין אבל הוא לא נסגר','s','✓']]],
['מה היית רוצה לראות בעוד שלושה חודשים?',[['יותר נוכחות וסמכות','pr','◉'],['יותר תנועה ופניות','ads','↗'],['כיוון מסודר וברור','m','◇'],['יותר עסקאות','s','✓']]],

];
const R={
pr:{title:'נוכחות ומיצוב',icon:'◈',text:'נראה שהמקום הראשון שכדאי לחזק הוא האופן שבו העסק מוכר, נתפס ונזכר.',reason:'עסק יכול להיות מצוין ועדיין לא לקבל מספיק מקום בתודעה. סיפור ברור, אמון ונוכחות עקבית משפיעים על מה שקורה אחר כך.',next:'לבדוק איך העסק נתפס היום, איזה סיפור נכון להוביל ואיפה כדאי להיות נוכחים.'},
ads:{title:'חשיפה וביקוש',icon:'↗',text:'נראה שהבסיס קיים, אבל חסרה כניסה מספקת של אנשים רלוונטיים למערכת.',reason:'לפני שמגדילים תקציבים, חשוב לדעת מי הקהל, מה המסר ומה בדיוק רוצים שיקרה אחרי החשיפה.',next:'להגדיר קהל, מסר ויעד מדיד — ואז לבחור את ערוצי החשיפה הנכונים.'},
m:{title:'כיוון ומסר',icon:'✦',text:'נראה שהצוואר בקבוק נמצא בחיבור בין העסק, המסר והלקוח.',reason:'כשהערך והבידול לא חדים, גם פרסום טוב עלול להביא תשומת לב בלי לייצר מספיק תנועה עסקית.',next:'לחדד למי העסק פונה, מה הוא פותר ולמה לבחור דווקא בו.'},
s:{title:'תהליך המכירה',icon:'✓',text:'נראה שכבר יש עניין — וההזדמנות היא להפוך יותר ממנו לתוצאה.',reason:'כאשר קיימות פניות או התעניינות, שיפור הדרך מפנייה ועד החלטה יכול להיות משמעותי יותר מהגדלת החשיפה.',next:'לבדוק מה קורה לליד מהרגע שהוא נכנס: מהירות תגובה, שיחה, הצעה ופולואפ.'}
};
let i=0,history=[],scores={pr:0,ads:0,m:0,s:0};const $=id=>document.getElementById(id);
function buildProgress(){$('progress').innerHTML=qs.map((_,n)=>`<div class="bar" id="b${n}"></div>`).join('');}
function start(){$('hero').style.display='none';$('progress').style.display='flex';$('quiz').style.display='block';buildProgress();render();}
function render(){const item=qs[i],total=qs.length;$('count').textContent=`שאלה ${i+1} מתוך ${total}`;$('pct').textContent=`${Math.round(i/total*100)}%`;$('question').textContent=item[0];$('answers').innerHTML='';item[1].forEach(([text,key,icon])=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="ico">${icon}</span><span>${text}</span>`;b.onclick=()=>choose(key);$('answers').appendChild(b);});for(let n=0;n<total;n++)$('b'+n).classList.toggle('on',n<=i);$('back').disabled=i===0;}
function choose(key){history.push(key);scores[key]++;if(i<qs.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'});}else show();}
function goBack(){if(i===0)return;const old=history.pop();scores[old]--;i--;render();}
function show(){$('quiz').style.display='none';$('progress').style.display='none';$('result').style.display='block';const keys=Object.keys(scores),winner=keys.sort((a,b)=>scores[b]-scores[a])[0],r=R[winner];$('ri').textContent=r.icon;$('rt').textContent=r.title;$('rx').textContent=r.text;$('rr').textContent=r.reason;$('rn').textContent=r.next;$('nextText').textContent='לא כל בעיה דורשת עוד פרסום. כדאי לוודא שהמהלך הבא מטפל בסיבה — ולא רק במה שרואים על פני השטח.';const max=Math.max(...Object.values(scores),1);[['pr','m1','v1'],['ads','m2','v2'],['m','m3','v3'],['s','m4','v4']].forEach(([k,id,v])=>{const pct=Math.round(scores[k]/max*100);$(id).style.width=pct+'%';$(v).textContent=scores[k];});const msg=encodeURIComponent(`היי יוסי, עשיתי את האבחון וקיבלתי: ${r.title}. אשמח לבדוק איתך מה נכון לעסק שלי.`);$('wa').href=`https://wa.me/972553048242?text=${msg}`;window.scrollTo({top:0,behavior:'smooth'});}
function restart(){i=0;history=[];scores={pr:0,ads:0,m:0,s:0};$('result').style.display='none';$('progress').style.display='none';$('hero').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}
