<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>אבחון עסקי | רוט</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f2f0;color:#151515;font-family:Arial,"Noto Sans Hebrew",sans-serif}.app{max-width:680px;min-height:100vh;margin:auto;background:#fff}.head{height:78px;background:#111;display:flex;align-items:center;justify-content:space-between;padding:9px 20px}.logo{display:flex;align-items:center;gap:10px}.word{font-size:31px;line-height:1;font-weight:900;color:#fff;letter-spacing:-2px}.arrow{position:relative;width:39px;height:39px;border:4px solid #e12636;border-left:0;border-bottom:0;transform:skewY(-28deg) rotate(-1deg);margin-right:-4px}.arrow:after{content:"";position:absolute;width:29px;height:4px;background:#e12636;right:-2px;top:6px;transform:rotate(-34deg);transform-origin:right center}.tag{font-size:12px;font-weight:800;color:#e12636;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:#e12636;box-shadow:0 0 0 5px #e1263622}.hero{padding:58px 24px 50px}.eyebrow{font-size:13px;color:#888;margin-bottom:12px}.hero h1{font-size:42px;line-height:1.08;margin:0 0 18px}.hero h1 span{color:#d92334}.hero p{font-size:18px;line-height:1.65;color:#60605c;margin:0}.start{margin-top:28px;border:0;border-radius:16px;background:#111;color:#fff;padding:17px 30px;font-size:18px;font-weight:800;cursor:pointer}.start span{color:#e12636}.quiz,.result{display:none;padding:28px 20px 45px}.top{display:flex;justify-content:space-between;color:#888;font-size:12px;margin-bottom:13px}.top b{color:#111}.bar{height:5px;background:#e8e8e5;border-radius:10px;overflow:hidden;margin-bottom:30px}.bar i{display:block;height:100%;width:0;background:#d92334}.domain{font-size:12px;font-weight:800;color:#d92334;margin-bottom:8px}.q{font-size:27px;line-height:1.35;margin:0 0 10px}.hint{font-size:14px;color:#777;margin:0 0 20px;line-height:1.5}.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.num,.choice{border:1px solid #ddd;background:#fff;border-radius:12px;cursor:pointer;font-weight:800}.num{padding:13px 0;font-size:16px}.num.sel,.num:hover,.choice.sel,.choice:hover{background:#111;color:#fff;border-color:#111}.choice{display:block;width:100%;text-align:right;padding:16px;margin:9px 0;font-size:15px;line-height:1.4}.labels{display:flex;justify-content:space-between;color:#999;font-size:11px;margin-top:8px}.back,.again{border:0;background:none;color:#888;cursor:pointer;margin-top:20px}.badge{display:inline-flex;padding:8px 12px;border-radius:99px;background:#f3f3f1;font-size:12px;color:#555}.badge i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d92334;margin-left:7px}.result h2{font-size:31px;line-height:1.18;margin:16px 0 10px}.lead{font-size:16px;line-height:1.65;color:#5d5d59}.map{border:1px solid #e1e1de;border-radius:18px;padding:18px;margin-top:22px;background:#fafaf8}.map h3{margin:0 0 18px;font-size:15px}.metric{display:grid;grid-template-columns:30px 78px 1fr 38px;align-items:center;gap:7px;margin:15px 0;font-size:12px;color:#555}.icon{font-size:21px;text-align:center}.track{height:8px;background:#e5e5e2;border-radius:99px;overflow:hidden}.fill{height:100%;background:#d92334;border-radius:99px}.ins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.box{border:1px solid #e4e4e1;border-radius:14px;padding:14px;background:#fff}.box b{display:block;font-size:12px;margin-bottom:6px}.box span{font-size:12px;line-height:1.55;color:#777}.next{margin-top:12px;border-right:3px solid #d92334;background:#f5f5f3;border-radius:12px;padding:14px}.next b{font-size:12px}.next p{margin:5px 0 0;font-size:12px;line-height:1.6;color:#666}.wa{display:flex;justify-content:center;align-items:center;text-decoration:none;background:#16c766;color:#fff;border-radius:16px;padding:17px;margin-top:18px;font-weight:800}@media(max-width:560px){.head{height:74px;padding:8px 17px}.word{font-size:29px}.arrow{width:36px;height:36px}.tag{font-size:11px}.hero{padding:44px 20px 38px}.hero h1{font-size:35px}.hero p{font-size:16px}.q{font-size:24px}.ins{grid-template-columns:1fr}.metric{grid-template-columns:28px 75px 1fr 35px}} </style></head><body><main class="app"><header class="head"><div class="logo"><div class="word">רוט</div><div class="arrow"></div><div class="tag">שיווק שמביא תוצאות</div></div><div class="dot"></div></header><section id="hero" class="hero"><div class="eyebrow">אבחון עסקי קצר</div><h1>מה חסר לעסק <span>שלך?</span></h1><p>10 שאלות קצרות. בסוף תקבל תמונה ברורה של מה העסק שלך צריך לחזק עכשיו.</p><button class="start" onclick="startQuiz()">מתחילים <span>↗</span></button></section><section id="quiz" class="quiz"><div class="top"><span id="count"></span><b id="pct"></b></div><div class="bar"><i id="bar"></i></div><div id="domain" class="domain"></div><h2 id="question" class="q"></h2><p id="hint" class="hint"></p><div id="scale" class="scale"></div><div class="labels"><span>צריך טיפול</span><span>מצוין</span></div><button class="back" id="back" onclick="goBack()">← חזרה</button></section><section id="result" class="result"><div class="badge"><i></i>התוצאה שלך</div><h2 id="title"></h2><p id="lead" class="lead"></p><div class="map"><h3>מפת 4 התחומים</h3><div id="metrics"></div></div><div class="ins"><div class="box"><b>מה בולט?</b><span id="strong"></span></div><div class="box"><b>מה לבדוק?</b><span id="weak"></span></div></div><div class="next"><b>הצעד הבא</b><p id="next"></p></div><a id="wa" class="wa" target="_blank" rel="noopener">רוצה לדבר על התוצאה? ↗</a><button class="again" onclick="restartQuiz()">לעשות שוב</button></section></main><script>const questions=[{k:'marketing',d:'שיווק',t:'scale',q:'עד כמה ברור לך מה היעד השיווקי המרכזי של העסק שלך?',h:'1 = לא ברור · 10 = ברור ומסודר'},{k:'branding',d:'מיתוג ובידול',t:'scale',q:'כשלקוח חדש פוגש את העסק שלך, עד כמה הוא מבין מיד למה לבחור דווקא בך?',h:'1 = הבידול לא ברור · 10 = הערך ברור מאוד'},{k:'marketing',d:'שיווק',t:'scale',q:'עד כמה הפרסום שלך מייצר פניות או מכירות שאפשר למדוד?',h:'1 = בעיקר חשיפה · 10 = תוצאה מדידה'},{k:'sales',d:'מכירות',t:'choice',q:'מה קורה בדרך כלל כשנכנסת פנייה טובה?',o:['יש תהליך מסודר ומעקב עד סגירה','יש תהליך, אבל המעקב חלקי','כל אחד מטפל בפניות בדרך אחרת','חלק מהפניות פשוט נעלמות']},{k:'pr',d:'יחסי ציבור',t:'choice',q:'איזו נוכחות יש לעסק שלך מעבר לפרסום הישיר?',o:['כתבות, המלצות ושיתופי פעולה באופן קבוע','יש מדי פעם חשיפה או המלצות','בעיקר המלצות אישיות','כמעט שאין חשיפה']},{k:'branding',d:'מיתוג ובידול',t:'choice',q:'עד כמה ההצעה שלך מדויקת וברורה ללקוח הנכון?',o:['מדויקת וברורה מאוד','די ברורה אבל אפשר לחדד','קשה לי להגדיר למי בדיוק','אני מציע כמה דברים לכמה קהלים']},{k:'marketing',d:'שיווק',t:'choice',q:'מאיפה מגיעים רוב הלקוחות החדשים שלך?',o:['המלצות','פרסום','תוכן וקהילה','שיתופי פעולה','אין מקור קבוע']},{k:'branding',d:'מיתוג ובידול',t:'scale',q:'עד כמה האתר, הוואטסאפ, ההצעות והפרסומים משדרים אותה רמה?',h:'1 = לא אחיד · 10 = מותג ברור ואחיד'},{k:'marketing',d:'שיווק',t:'choice',q:'כשאתה מפרסם, עד כמה הקהל שאתה מכוון אליו מוגדר?',o:['מדויק מאוד','יש כיוון אבל אפשר לדייק','פונה לכמה קהלים','כמעט לכולם']},{k:'sales',d:'מכירות',t:'scale',q:'אם מחר ייכנסו פי שניים פניות, עד כמה העסק ערוך להפוך אותן להכנסות?',h:'1 = לא ערוך · 10 = תהליך מסודר'}];const labels={marketing:'שיווק חד וברור',sales:'מכירות מסודרות',pr:'יחסי ציבור חזקים',branding:'מיתוג ובידול'},icons={marketing:'📈',sales:'💰',pr:'📣',branding:'✨'},heb={marketing:'שיווק',sales:'מכירות',pr:'יחסי ציבור',branding:'מיתוג ובידול'};let idx=0,ans=[];function startQuiz(){idx=0;ans=[];render()}function render(){hero.style.display='none';result.style.display='none';quiz.style.display='block';const q=questions[idx];count.textContent='שאלה '+(idx+1)+' מתוך '+questions.length;pct.textContent=Math.round(idx/questions.length*100)+'%';bar.style.width=((idx+1)/questions.length*100)+'%';domain.textContent=q.d;question.textContent=q.q;hint.textContent=q.h||'';scale.innerHTML='';if(q.t==='choice'){q.o.forEach((x,j)=>{const b=document.createElement('button');b.className='choice'+(ans[idx]===j+1?' sel':'');b.textContent=x;b.onclick=()=>pick(j+1);scale.appendChild(b)})}else for(let n=1;n<=10;n++){const b=document.createElement('button');b.className='num'+(ans[idx]===n?' sel':'');b.textContent=n;b.onclick=()=>pick(n);scale.appendChild(b)}back.style.visibility=idx?'visible':'hidden';scrollTo(0,0)}function pick(n){ans[idx]=n;if(idx<questions.length-1){idx++;render()}else finish()}function goBack(){if(idx>0){idx--;render()}}function finish(){const s={marketing:0,sales:0,pr:0,branding:0},c={marketing:0,sales:0,pr:0,branding:0};questions.forEach((q,j)=>{const n=ans[j]||1,v=q.t==='choice'?Math.round(n/q.o.length*10):n;s[q.k]+=v;c[q.k]++});const p={};Object.keys(s).forEach(k=>p[k]=Math.round(s[k]/(c[k]*10)*100));const gap=Object.keys(p).sort((a,b)=>p[a]-p[b])[0];quiz.style.display='none';result.style.display='block';title.textContent='הדבר שהכי חשוב לעסק שלך הוא '+labels[gap];lead.textContent='זהו התחום שכדאי לחזק עכשיו כדי ליצור עסק ברור, חזק וצומח יותר.';metrics.innerHTML=Object.keys(p).map(k=>'<div class="metric"><span class="icon">'+icons[k]+'</span><span>'+heb[k]+'</span><div class="track"><div class="fill" style="width:'+p[k]+'%"></div></div><b>'+p[k]+'%</b></div>').join('');const strongest=Object.keys(p).sort((a,b)=>p[b]-p[a])[0];strong.textContent=heb[strongest]+' הוא התחום החזק ביותר כרגע ('+p[strongest]+'%).';weak.textContent=heb[gap]+' קיבל את הציון הנמוך ביותר ולכן הוא המקום הראשון לבדיקה.';next.textContent='מומלץ להתחיל מהתחום הזה, לבחור יעד אחד ברור ולבנות סביבו מהלך שיווקי מדיד.';wa.href='https://wa.me/972553048242?text='+encodeURIComponent('היי יוסי, עשיתי את האבחון העסקי ורוצה לדבר על התוצאה שלי.');scrollTo(0,0)}function restartQuiz(){startQuiz()}</script></body></html>
